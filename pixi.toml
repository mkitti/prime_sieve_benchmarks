[workspace]
authors = ["Mark Kittisopikul <kittisopikulm@janelia.hhmi.org>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "sieve"
platforms = ["linux-64"]
version = "0.1.0"

# julia is pinned to 1.12.* because conda-forge's 1.13 build doesn't ship
# the standalone juliac.jl launcher that build-julia uses to AOT-compile
# sieve_julia (juliac moved to a separate JuliaC.jl package upstream in 1.13).
[tasks]
build-julia = "julia --startup-file=no $(julia -e 'print(joinpath(Sys.BINDIR, \"..\", \"share\", \"julia\", \"juliac\", \"juliac.jl\"))') --output-exe sieve_julia --experimental --trim=safe sieve.jl"

[dependencies]
max = ">=26.5.0,<27"
hyperfine = ">=1.20.0,<2"
python = ">=3.12.14,<3.13"
julia = "1.12.*"
