[workspace]
authors = ["Mark Kittisopikul <kittisopikulm@janelia.hhmi.org>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "sieve"
platforms = ["linux-64"]
version = "0.1.0"

# On Julia 1.13, the standalone juliac.jl launcher moved out of the julia
# package into a separate app installed via `Pkg.Apps.add("JuliaC")`.
[tasks]
install-juliac = "julia --startup-file=no -e 'using Pkg; mkpath(dirname(Base.active_project())); isfile(Base.active_project()) || write(Base.active_project(), \"\"); Pkg.instantiate(); Pkg.Registry.add(); Pkg.Apps.add(\"JuliaC\")'"
build-julia = { cmd = "$(julia -e 'print(joinpath(Sys.BINDIR, \"..\", \"share\", \"julia\", \"bin\", \"juliac\"))') --output-exe sieve_julia --experimental --trim=safe sieve.jl", depends-on = [
    "install-juliac",
] }
build-mojo = "mojo build sieve.mojo -o sieve_mojo"

[dependencies]
hyperfine = ">=1.20.0,<2"
python = ">=3.12.14,<3.13"
julia = "1.13.*"
mojo-compiler = ">=1.0.0,<2"
